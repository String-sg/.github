# Reusable workflow: Claude reviews a pull request opened by one author, then
# proposes fixes as a separate pull request into that PR's branch.
#
# Repos opt in with a small caller workflow (see docs/claude-pr-autofix.md).
# It never pushes to the reviewed branch: the only way code leaves the runner
# is open-fix-pr.sh below, which verifies, refuses protected paths, and opens
# a stacked PR the author merges or closes.
#
# Off switches, narrowest first:
#   - label a PR `no-autofix`
#   - set the repo variable CLAUDE_AUTOFIX=off (checked by the caller)
#   - delete the caller workflow from the repo
#   - make the gate job's `if:` below false here: stops every repo at once
#   - delete the repo's CLAUDE_CODE_OAUTH_TOKEN secret: that repo skips
name: Claude PR auto-review (reusable)

on:
  workflow_call:
    inputs:
      author:
        description: GitHub login whose PRs are reviewed
        type: string
        default: ghostleek
      node_version:
        type: string
        default: "22"
      setup:
        description: Shell run before Claude starts, e.g. `npm ci`
        type: string
        default: npm ci
      verify:
        description: >-
          Verification commands, one per line. Claude may run exactly these,
          and open-fix-pr.sh runs all of them before it pushes anything.
        type: string
        required: true
      allowed_bash:
        description: Extra Bash permission patterns for Claude, one per line, e.g. `npx vitest run:*`
        type: string
        default: ""
      protected_paths:
        description: Path prefixes a fix may never touch, one per line (always includes .github/ and .claude/)
        type: string
        default: ""
      postgres_env:
        description: If set, start Postgres 17 and export its URL under this env var name
        type: string
        default: ""
      model:
        type: string
        default: claude-opus-5-5
      max_turns:
        type: number
        default: 40
    secrets:
      # Optional so a repo whose caller lands before its secret skips cleanly
      # instead of failing every PR check.
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  gate:
    # Loop guard: fix PRs are authored by claude[bot], so they never match the
    # author check, and the bot never pushes to the reviewed branch.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == inputs.author
      && github.actor == inputs.author
      && github.event.pull_request.head.repo.full_name == github.repository
      && !contains(github.event.pull_request.labels.*.name, 'no-autofix')
      && ((github.event.action == 'opened' && !github.event.pull_request.draft)
          || github.event.action == 'ready_for_review'
          || (github.event.action == 'labeled' && github.event.label.name == 'claude-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      ok: ${{ steps.token.outputs.ok }}
    steps:
      # `secrets` can't be read in a job `if:`, so check it in a step.
      - id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -n $TOKEN ]]; then
            echo ok=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set in this repo, so the review is skipped. See String-sg/.github docs/claude-pr-autofix.md."
            echo ok=false >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level so that skipped runs (e.g. an unrelated label) never cancel a review.
    concurrency:
      group: claude-pr-autofix-${{ github.repository }}-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable pnpm/yarn via corepack
        if: hashFiles('pnpm-lock.yaml', 'yarn.lock') != ''
        run: corepack enable

      - name: Start Postgres
        if: inputs.postgres_env != ''
        env:
          VAR: ${{ inputs.postgres_env }}
        run: |
          # Throwaway database on the runner, with a password made fresh each run.
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          docker run -d --name pg -e POSTGRES_PASSWORD="$pw" -p 5432:5432 postgres:17
          for _ in $(seq 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          echo "$VAR=postgresql://postgres:$pw@localhost:5432/postgres" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: ${{ inputs.setup }}

      - name: Write fix-PR helper
        env:
          VERIFY: ${{ inputs.verify }}
          PROTECTED: ${{ inputs.protected_paths }}
          EXTRA_BASH: ${{ inputs.allowed_bash }}
        run: |
          bin=/tmp/claude-autofix-bin
          mkdir -p "$bin" /tmp/claude-autofix
          # `|| exit 1` per line: set -e alone ignores failures of `!` commands.
          { echo 'set -uo pipefail'; printf '%s\n' "$VERIFY" | sed '/^[[:space:]]*$/d; s/$/ || exit 1/'; } > "$bin/verify.sh"
          { printf '%s\n' .github/ .claude/ "$PROTECTED"; } | sed '/^[[:space:]]*$/d' > "$bin/protected-paths"
          printf 'PR_NUMBER=%q\nHEAD_REF=%q\n' "$PR_NUMBER" "$HEAD_REF" > "$bin/env"
          cat > "$bin/open-fix-pr.sh" <<'SH'
          #!/usr/bin/env bash
          # The only route for Claude's edits to leave the runner: verify, refuse
          # protected paths, then push a new branch and open a PR into the PR branch.
          set -euo pipefail
          title=${1:?usage: open-fix-pr.sh "<title>" <body-file>}
          body=${2:?usage: open-fix-pr.sh "<title>" <body-file>}
          bin=/tmp/claude-autofix-bin
          source "$bin/env"
          cd "$GITHUB_WORKSPACE"
          git add -A -- . ':(exclude)*.tsbuildinfo'
          mapfile -t changed < <(git diff --cached --name-only)
          if (( ${#changed[@]} == 0 )); then echo "Nothing to propose: no changes."; exit 1; fi
          while read -r prefix; do
            for f in "${changed[@]}"; do
              if [[ $f == "$prefix"* ]]; then
                git reset -q
                echo "Refused: $f is under protected path $prefix. Report it instead."; exit 2
              fi
            done
          done < "$bin/protected-paths"
          if ! bash "$bin/verify.sh"; then
            git reset -q
            echo "Refused: verification failed. Nothing was pushed."; exit 3
          fi
          branch="claude/autofix-pr-$PR_NUMBER-$GITHUB_RUN_ID"
          git switch -q -c "$branch"
          git commit -q -m "$title" -m "Proposed by the Claude auto-review of #$PR_NUMBER."
          git push -q origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$HEAD_REF" --head "$branch" \
            --title "$title" --body-file "$body"
          SH
          chmod 555 "$bin"/*.sh
          # Claude may run each verify command exactly as written, plus any extras.
          tools="Read,Edit,Write,Glob,Grep,mcp__github_inline_comment__create_inline_comment"
          tools+=",Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
          tools+=",Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Bash(git restore:*)"
          tools+=",Bash(head:*),Bash(tail:*),Bash(wc:*),Bash($bin/open-fix-pr.sh:*)"
          while IFS= read -r line; do
            [[ -n ${line// } ]] && tools+=",Bash($line)"
          done < <(printf '%s\n' "$VERIFY")
          while IFS= read -r line; do
            [[ -n ${line// } ]] && tools+=",Bash($line)"
          done < <(printf '%s\n' "$EXTRA_BASH")
          echo "ALLOWED_TOOLS=$tools" >> "$GITHUB_ENV"
          # shellcheck disable=SC2016 # the backticks are Markdown, not expansions
          {
            echo 'VERIFY_LIST<<EOF'; printf '%s\n' "$VERIFY" | sed '/^[[:space:]]*$/d; s/^/   - `/; s/$/`/'; echo EOF
            echo 'PROTECTED_LIST<<EOF'; sed 's/^/   - `/; s/$/`/' "$bin/protected-paths"; echo EOF
          } >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --add-dir /tmp/claude-autofix
            --allowedTools "${{ env.ALLOWED_TOOLS }}"
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(git switch:*),Bash(git checkout:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR BRANCH: ${{ github.event.pull_request.head.ref }} (into ${{ github.event.pull_request.base.ref }})

            You are the automatic reviewer for pull requests that ${{ inputs.author }} opens. The PR head is
            checked out in the working directory. Review the PR, fix what is safe to fix, and report the rest.
            You never change the PR branch: fixes go to a separate pull request into it, which the author
            merges or closes.

            1. Understand the change: run `gh pr view ${{ github.event.pull_request.number }}` and
               `gh pr diff ${{ github.event.pull_request.number }}`. Read AGENTS.md, CLAUDE.md and README.md
               if present; they hold the repo's rules.

            2. Review for correctness bugs, regressions, missing edge cases or error handling, broken repo
               rules, changed behaviour without tests, and docs that no longer match the code. Skip style
               points a formatter would catch. Check each finding against the code and keep only those where
               you can name the concrete input or state that goes wrong.

            3. Give each finding one action:
               - fix: a local, unambiguous correction whose intended behaviour is clear from the PR itself
                 (a bug, a failing check, a missing guard, a test for changed code, a stale comment or doc).
               - report: anything that needs the author's judgement. Always report, never fix: product
                 behaviour or copy, UX, security, auth, permissions, crypto or secret handling, data model,
                 schema or migration changes, adding or upgrading dependencies, public API contracts, CI,
                 workflow and Claude settings files, and anything you are unsure about.

            4. If there are fix findings, make the smallest edits that fix them, then run the verification:
            ${{ env.VERIFY_LIST }}
               When it passes, write a PR description to /tmp/claude-autofix/fix-pr.md (one bullet per fix,
               naming the finding it closes) and run:
                 /tmp/claude-autofix-bin/open-fix-pr.sh "<short imperative title>" /tmp/claude-autofix/fix-pr.md
               It re-runs verification, refuses protected paths, pushes a new branch and opens the PR, then
               prints its URL. If it refuses, fix the cause once and retry. If it refuses again, run
               `git restore --staged --worktree .` and turn those findings into report findings.
               Never touch these paths:
            ${{ env.PROTECTED_LIST }}

            5. Post exactly one comment: write it to /tmp/claude-autofix/review.md and run
               `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/claude-autofix/review.md`.
               Format:
               **Claude auto-review**: one-line verdict.
               **Fix PR:** its URL, or "none".
               A table, most severe first: `#` | Finding | Where (`path:line`) | Action ("fixed in fix PR",
               or "report:" plus what the author needs to decide).
               Also leave an inline comment (mcp__github_inline_comment__create_inline_comment with
               confirmed: true) on the line for each report finding that has one.
               If nothing is worth raising, the comment is one line saying so.
               Plain, precise language. No praise, no filler, no restating the diff.

      - name: Clear the claude-review label so it can be re-added
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label claude-review || true
